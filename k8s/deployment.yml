apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-app
  labels:
    app: taskflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskflow
  template:
    metadata:
      labels:
        app: taskflow
    spec:
      containers:
        - name: taskflow
          image: hzmasbl/taskflow:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: "512Mi"
              cpu: "1000m"
            requests:
              memory: "256Mi"
              cpu: "250m"

          # TCP Probes ensure stability without depending on Actuator HTTP endpoints
          startupProbe:
            tcpSocket:

              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30

          readinessProbe:
            tcpSocket:

              port: 8080
            periodSeconds: 5
            failureThreshold: 3

          livenessProbe:
            tcpSocket:

              port: 8080
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: taskflow-service
spec:
  type: NodePort
  selector:
    app: taskflow
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080